name: Sales Workbook integration verification
on:
  push:
    branches:
      - integration/sales-workbook-batch-main-20261102
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: isolated_workbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused workbook regression tests
        run: node --test tests/SalesOrderCorrection.test.mjs tests/SalesWorkbookCorrectionProfit.test.mjs tests/SalesWorkbookCorrectionRoute.test.mjs tests/SalesWorkbookUploadUi.test.mjs tests/SalesWorkbookDeferredRecovery.test.mjs tests/SalesWorkbookThemePreservation.test.mjs tests/SalesWorkbookPendingOrders.test.mjs
      - name: Isolated PostgreSQL atomic batch transaction
        env:
          PGPASSWORD: test-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d isolated_workbook_test -f tests/fixtures/sales-workbook-batch-postgres-schema.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d isolated_workbook_test -f ../../supabase/migrations/20261127000000_atomic_sales_workbook_correction_batches.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d isolated_workbook_test -f tests/fixtures/sales-workbook-batch-postgres-integration.sql
